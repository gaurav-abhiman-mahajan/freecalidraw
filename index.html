<!DOCTYPE html>
<html lang="en">

    <script>
      // Dynamically resolve Freecalidraw asset path for local, Docker, and GitHub Pages
      window.EXCALIDRAW_ASSET_PATH = window.location.pathname.endsWith('/')
        ? window.location.pathname
        : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

      }
