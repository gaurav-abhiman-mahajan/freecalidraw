services:
  freecalidraw:
    build:
      context: .
      dockerfile: Dockerfile
    image: freecalidraw:latest
    container_name: freecalidraw-app
    restart: always
    ports:
      - "80:3000"
      - "${FREECALIDRAW_PORT:-8090}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
